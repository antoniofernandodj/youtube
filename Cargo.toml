[package]
name = "youtube"
version = "0.1.0"
edition = "2024"

[dependencies]
# `webview` é o que reproduz o vídeo de verdade: `open_window({ webview_url =
# "..." })` abre uma janela cujo conteúdo inteiro é uma webview nativa do SO
# (WebKitGTK aqui). A API de Dados do YouTube não devolve URL de stream (é
# proposital, pelos termos de uso) — só metadados —, então este app usa a API
# só pra busca/navegação e ABRE A PÁGINA DE VERDADE do YouTube
# (`youtube.com/watch?v=...`) nessa webview pra assistir; o IFrame Player
# embutido (`/embed/...`) foi tentado antes e o próprio YouTube recusa
# (Error 153 / "vídeo indisponível") — restrição deles, não do motor, e
# `youtube.com/watch` normal não tem esse problema. No Linux, `webview` exige
# X11 (o motor força sozinho, ver `forcar_x11_para_webview` no glacier-ui) —
# `libwebkit2gtk-4.1-dev` no build, `libwebkit2gtk-4.1-0` em runtime.
#
# SEM `tray`: no Linux ela e a `webview` disputam o GTK (a bandeja sobe numa
# thread própria com `gtk::init()`+`gtk::main()`; a webview precisa da
# THREAD PRINCIPAL, onde mora a janela). A segunda inicialização panica
# ("Attempted to initialize GTK from two different threads") assim que a
# primeira janela de vídeo abre — reproduzido e confirmado nesta versão
# (glacier-ui 0.104.0). Ver o comentário em `src/main.rs`.
#
# 0.107.1 (não menos): o ícone, a instância única, a geometria lembrada e o
# diretório de dados são declarados no cabeçalho de `views/app.gv` (`<screen
# icon>` e `<app>`), e não mais no `main.rs`; o script acha o diretório de
# dados em `ctx.__data_dir`. Desde a 0.104.2 também corrige um
# `fetch`/`http()` que podia ficar pendurado pra sempre numa rede com IPv6
# quebrado — reproduzido ao vivo contra a API do YouTube nesta mesma máquina
# (ver CHANGELOG do glacier-ui).
glacier-ui = { version = "0.107.1", features = ["webview"] }

# O app lê `views/` em runtime (é o que dá o hot-reload), então o .deb leva a
# pasta junto. O binário instalado é chamado pelo wrapper que o
# `packaging/linux/instalar.sh` cria — ver o comentário lá sobre por quê.
#
# Sem `depends` manual: `libwebkit2gtk-4.1.so.0` é linkada DIRETO no binário
# (confirmado via `ldd`), então o `dpkg-shlibdeps` do `cargo-deb` já a
# detecta e declara sozinho — um `depends` escrito à mão aqui substituiria a
# detecção automática em vez de somar a ela, perdendo as outras libs (GTK,
# glib, cairo, pango…) que ela também captura.
[package.metadata.deb]
assets = [
    ["target/release/youtube", "usr/share/youtube/", "755"],
    ["views/**/*", "usr/share/youtube/views/", "644"],
    ["packaging/linux/wrapper.sh", "usr/bin/youtube", "755"],
]
